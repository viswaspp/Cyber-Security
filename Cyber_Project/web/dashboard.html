
<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Cyber Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Advanced Cybersecurity Dashboard</h1>
  <div>
    <canvas id="logsChart" width="600" height="200"></canvas>
  </div>
  <div id="summary"></div>
<script>
async function refresh(){
  const res = await fetch('/analytics/summary');
  const data = await res.json();
  document.getElementById('summary').innerText = JSON.stringify(data, null, 2);
  const labels = data.top_sources.map(s=>s.ip);
  const counts = data.top_sources.map(s=>s.count);
  const ctx = document.getElementById('logsChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets:[{label:'Top sources', data: counts}]}
  });
}
refresh();
</script>
</body>
</html>
